version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: video-rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    container_name: video-rag-ui

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    volumes:
      - ./data:/app/data

    depends_on:
      - backend